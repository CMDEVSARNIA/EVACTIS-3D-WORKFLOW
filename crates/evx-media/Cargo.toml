[package]
name = "evx-media"
description = "Local media pipeline for EVACTIS 3DWORKFLOW Studio: validation, EXIF, cube tiling, previews, video transcoding, 3D/splat checks. No network code."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flate2 = "=1.1.5"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "tiff", "hdr", "rayon"] }
kamadak-exif = "=0.6.1"
rayon = "=1.11.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.23.0"
