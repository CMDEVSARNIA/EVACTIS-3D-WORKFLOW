name: Windows installers

# Builds signed (test certificate until the Evactis certificate is provided) NSIS and
# MSI installers for Studio and Viewer, then installs, launches and uninstalls each
# one silently with the product's network access blocked.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  build:
    name: Build installers
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build front ends
        run: pnpm turbo run build
      - name: Rust tests (Windows)
        run: cargo test --workspace --locked
      - name: Test signing certificate
        # Release signing never happens in CI: the Evactis key lives on a USB hardware
        # token at an offline signing station (ADR 0008). CI proves the pipeline with a
        # throw-away TEST certificate.
        shell: pwsh
        run: |
          $thumb = & scripts/windows/new-test-cert.ps1
          "EVX_SIGN_THUMBPRINT=$thumb" >> $env:GITHUB_ENV
          "EVX_TIMESTAMP_URL=http://timestamp.digicert.com" >> $env:GITHUB_ENV
      - name: Build signed installers
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/windows/build-installers.ps1
      - name: Verify signatures
        shell: pwsh
        run: |
          Get-ChildItem out/installers/* | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($s.Status) — $($s.SignerCertificate.Subject)"
            if (-not $s.SignerCertificate) { throw "$($_.Name) is not signed" }
          }
          # Public key of the signer, so the smoke-test runner can trust a TEST signature.
          $c = (Get-AuthenticodeSignature (Get-ChildItem out/installers/*.msi | Select-Object -First 1).FullName).SignerCertificate
          [IO.File]::WriteAllBytes('out/installers/signer.cer', $c.Export('Cert'))
      - name: Delivery packages of the demo facility (Phase 10)
        # The same packaging library as Studio's Package dialog, with the signed Viewer
        # and the NSIS that Studio bundles. The per-facility setup is signed here as it
        # would be at the signing station.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $viewer = 'target/release/EVACTIS-3DWORKFLOW-Viewer.exe'
          $out = 'out/packages'
          node tools/package.mjs --kind installer --out $out --name 'Evactis Demo Centre' --viewer $viewer `
            --makensis target/studio-nsis/makensis.exe --webview2-installer target/webview2/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          node tools/package.mjs --kind portable --out $out --name portable --viewer $viewer
          node tools/package.mjs --kind evx --out $out --name demo
          node tools/package.mjs --kind evx --out $out --name demo-encrypted --passphrase 'correct horse battery staple'
          node tools/smoke/alter-package.mjs "$out/demo.evx" "$out/demo-altered.evx"
          Remove-Item -Recurse "$out/Evactis Demo Centre"
          & scripts/windows/sign.ps1 "$out/Evactis Demo Centre Setup.exe"
          Get-ChildItem $out | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }
      - name: Site Server standalone program (Phase 11)
        # The Node runtime of this build with the Site Server injected; started once on
        # loopback, then signed like every other program.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/site-server/scripts/sea.mjs --check
          & scripts/windows/sign.ps1 apps/site-server/dist/standalone/evactis-3dworkflow-site-server.exe
          $s = Get-AuthenticodeSignature apps/site-server/dist/standalone/evactis-3dworkflow-site-server.exe
          if (-not $s.SignerCertificate) { throw 'the Site Server program is not signed' }
          # Unattended mode: a boot task as LOCAL SERVICE; it must answer, log the setup
          # code to its data folder, and uninstall cleanly.
          $exe = (Resolve-Path apps/site-server/dist/standalone/evactis-3dworkflow-site-server.exe).Path
          $data = Join-Path $PWD 'out\site-task'
          New-Item -ItemType Directory -Force $data | Out-Null
          '{"siteName":"Task check","port":4392,"turn":{"port":4393}}' | Set-Content -Encoding ascii (Join-Path $data 'config.json')
          & $exe install-task --data $data
          $ok = $false
          $PSNativeCommandUseErrorActionPreference = $false  # curl fails until the server is up
          foreach ($i in 1..60) {
            curl.exe -sk --max-time 2 https://127.0.0.1:4392/health | Out-Null
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep 1
          }
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $ok) { Get-Content (Join-Path $data 'site-server.log') -ErrorAction SilentlyContinue; throw 'the scheduled task did not start the server' }
          if (-not (Select-String -Quiet 'setup code' (Join-Path $data 'site-server.log'))) { throw 'no setup code in the log' }
          & $exe uninstall-task
          if (Get-ScheduledTask -TaskName 'EVACTIS 3DWORKFLOW Site Server' -ErrorAction SilentlyContinue) { throw 'the task is still registered' }
          Write-Host 'Scheduled task: installed, answered, logged the setup code, uninstalled.'
      - uses: actions/upload-artifact@v4
        with:
          name: site-server-windows
          path: apps/site-server/dist/standalone/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-packages
          path: out/packages/
          retention-days: 14
      - name: Offline rebuild (toolchain network blocked, no timestamp)
        # Proves that with warm caches the full build + sign runs with no network,
        # as on an air-gapped Evactis build/signing station.
        shell: pwsh
        run: |
          scripts/windows/build-installers.ps1 -Offline -OutDir out/offline-check
          Get-ChildItem out/offline-check/* | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            if (-not $s.SignerCertificate) { throw "$($_.Name) was not signed offline" }
            Write-Host "$($_.Name): signed offline ($($s.Status))"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: out/installers/
          retention-days: 14

  smoke:
    name: Install → launch → uninstall (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: out/installers
      - uses: actions/download-artifact@v4
        with:
          name: delivery-packages
          path: out/packages
      - name: Trust the signer (test certificate only)
        shell: pwsh
        run: |
          $c = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path out/installers/signer.cer))
          if ($c.Subject -like '*TEST*') {
            Import-Certificate -FilePath out/installers/signer.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            Import-Certificate -FilePath out/installers/signer.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          }
      - name: Smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $i = 'out/installers'
          foreach ($app in 'Studio', 'Viewer') {
            scripts/windows/smoke-test.ps1 -App $app -Installer (Get-ChildItem "$i/EVACTIS-3DWORKFLOW-$app-*-setup.exe").FullName
            scripts/windows/smoke-test.ps1 -App $app -Installer (Get-ChildItem "$i/EVACTIS-3DWORKFLOW-$app-*-en-US.msi").FullName
          }
          scripts/windows/smoke-test.ps1 -App Viewer -PerUser -Installer (Get-ChildItem "$i/EVACTIS-3DWORKFLOW-Viewer-*-setup.exe").FullName
      - name: Installer QA (upgrade, downgrade refused, French MSI, accented folder, clean uninstall)
        shell: pwsh
        run: scripts/windows/installer-qa.ps1 -Installers out/installers
      - name: Delivery packages (installer, portable, .evx, passphrase, integrity)
        shell: pwsh
        run: |
          scripts/windows/package-acceptance.ps1 -Packages out/packages `
            -ViewerInstaller (Get-ChildItem "out/installers/EVACTIS-3DWORKFLOW-Viewer-*-setup.exe").FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-${{ matrix.os }}
          path: |
            out/smoke/
            out/installer-qa/
            out/packages-smoke/
          retention-days: 14
