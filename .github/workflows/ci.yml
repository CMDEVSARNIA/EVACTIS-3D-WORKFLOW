name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  check:
    name: pnpm check (offline guardrail)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Poppler, unzip and xmllint (print and package tests read their output back); OpenLDAP (Site Server directory sign-in)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            poppler-utils unzip libxml2-utils slapd
          sudo systemctl stop slapd || true
      - name: pnpm check
        run: pnpm check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  real-app:
    # The built desktop apps (not the browser test build), started inside a network
    # namespace with no interfaces: the UI must render, Studio must import a 12K
    # panorama and a 360 video and show them in its library, and nothing may attempt
    # or be refused a network request. Screenshots are uploaded for review.
    name: Real apps offline (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages (Tauri on Linux, virtual display, test media)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            xvfb imagemagick ffmpeg
      - name: Allow unprivileged network namespaces (Ubuntu 24.04 restricts them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - name: Build both apps and the import example (release)
        run: |
          pnpm turbo run build
          pnpm --filter @evactis-3dworkflow/studio tauri build --no-bundle
          pnpm --filter @evactis-3dworkflow/viewer-desktop tauri build --no-bundle
          cargo build --release -p evx-media --example import
      - name: Real-app smoke (no network interfaces)
        run: scripts/linux/real-app-smoke.sh target/real-app-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-app-screenshots
          path: |
            target/real-app-smoke/*.png
            target/real-app-smoke/*.json
            target/real-app-smoke/*.log
          retention-days: 14

  site-server:
    # Phase 11 acceptance: two client machines and the Site Server on an isolated network
    # built from network namespaces (no path between the clients, none to the internet).
    # They share notes and run a guided session with audio over the server's own relay;
    # the run fails if the server sends one packet off the site network. Then the
    # standalone program and the Docker image are built and started.
    name: Site Server (isolated network, standalone, Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Allow unprivileged network namespaces (Ubuntu 24.04 restricts them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the Site Server and the demo facility
        run: pnpm turbo run build --filter=@evactis-3dworkflow/site-server...
      - name: Two machines on an isolated network, server outbound blocked
        run: scripts/linux/site-server-lan.sh target/site-lan
      - name: Standalone program (Node single executable)
        run: node apps/site-server/scripts/sea.mjs --check
      - name: Docker image
        run: |
          pnpm --filter @evactis-3dworkflow/site-server docker
          # The image runs as uid 1000 (node), which must own the data folder.
          data=$(mktemp -d)
          echo '{"siteName":"Docker check","port":4390,"turn":{"port":4391}}' >"$data/config.json"
          sudo chown -R 1000:1000 "$data"
          docker run -d --name evx-site --network host -v "$data:/data" evactis-3dworkflow-site-server:0.1.0
          for i in $(seq 30); do curl -skf https://127.0.0.1:4390/health && break; sleep 1; done
          docker logs evx-site 2>&1 | tee docker.log
          grep -q 'setup code' docker.log && ! grep -q '"level":50' docker.log
          docker rm -f evx-site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-server
          path: |
            target/site-lan/server.log
            target/site-lan/outside.txt
            target/site-lan/results/
            apps/site-server/dist/standalone/
          retention-days: 14
