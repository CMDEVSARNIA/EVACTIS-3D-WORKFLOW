[package]
name = "evactis-3dworkflow-viewer"
description = "EVACTIS 3DWORKFLOW Viewer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "evx_viewer"
crate-type = ["rlib"]

[[bin]]
name = "evactis-3dworkflow-viewer"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
evx-core.workspace = true
evx-desktop.workspace = true
evx-package.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true

[dev-dependencies]
tempfile = "=3.23.0"

# Native open dialog (Windows: COM file dialogs; Linux: the GTK Tauri already uses).
[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.16.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3"] }
