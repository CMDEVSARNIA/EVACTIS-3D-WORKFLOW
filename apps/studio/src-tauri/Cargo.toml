[package]
name = "evactis-3dworkflow-studio"
description = "EVACTIS 3DWORKFLOW Studio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "evx_studio"
crate-type = ["rlib"]

[[bin]]
name = "evactis-3dworkflow-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
evx-core.workspace = true
evx-desktop.workspace = true
evx-media.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["protocol-asset"] }

# Native open/folder dialogs (Windows: COM file dialogs; Linux: the GTK Tauri already uses).
[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.16.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3"] }
